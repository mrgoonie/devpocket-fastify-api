name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, 'dev/*' ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: devpocket_test
          POSTGRES_PASSWORD: devpocket_test
          POSTGRES_DB: devpocket-fastify-api-test
        options: >-
          --health-cmd "pg_isready -U devpocket_test -d devpocket-fastify-api-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      
      # Optional SSH server for integration testing
      # Enable by setting SSH_TEST_REAL_SERVER=true in environment
      ssh-server:
        image: linuxserver/openssh-server:latest
        env:
          PUID: 1000
          PGID: 1000
          TZ: UTC
          USER_NAME: testuser
          USER_PASSWORD: testpass
          PASSWORD_ACCESS: true
          SUDO_ACCESS: false
          PUBLIC_KEY_FILE: /config/.ssh/authorized_keys
        # Alternative health check options if netcat fails:
        # --health-cmd "pgrep sshd || exit 1"
        # --health-cmd "test -f /var/run/sshd.pid || exit 1"
        options: >-
          --health-cmd "nc -z localhost 2222 || exit 1"
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 60s
          --health-start-interval 5s
        ports:
          - 2222:2222

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup environment
        run: |
          cp .env.test.example .env.test
          echo "DATABASE_URL=postgresql://devpocket_test:devpocket_test@localhost:5432/devpocket-fastify-api-test?schema=public" >> .env.test
          echo "REDIS_URL=redis://localhost:6379/1" >> .env.test
          
          # SSH Test Configuration
          # Option 1: Use Docker SSH server (recommended for CI)
          if [[ "${{ vars.SSH_TEST_REAL_SERVER }}" == "true" ]]; then
            echo "SSH_TEST_REAL_SERVER=true" >> .env.test
            echo "SSH_TEST_HOST=localhost" >> .env.test
            echo "SSH_TEST_PORT=2222" >> .env.test
            echo "SSH_TEST_PWD_USER=testuser" >> .env.test
            echo "SSH_TEST_PWD_PASS=testpass" >> .env.test
            echo "=== Using Docker SSH server for SSH tests ==="
          else
            # Option 2: Use external SSH server (if secrets are configured)
            if [[ -n "${{ secrets.HOST_IP }}" ]]; then
              echo "SSH_TEST_HOST=${{ secrets.HOST_IP }}" >> .env.test
              echo "SSH_TEST_PORT=22" >> .env.test
              echo "SSH_TEST_PWD_USER=${{ secrets.SSH_USER_1 }}" >> .env.test
              echo "SSH_TEST_PWD_PASS=${{ secrets.SSH_PASS_1 }}" >> .env.test
              echo "SSH_TEST_KEY_USER=${{ secrets.SSH_USER_2 }}" >> .env.test
              echo "SSH_TEST_PUBLIC_KEY=${{ secrets.SSH_KEY_2 }}" >> .env.test
              echo "SSH_TEST_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY_2 }}" >> .env.test
              echo "=== Using external SSH server for SSH tests ==="
            else
              echo "=== Using mock SSH tests (no real server configured) ==="
            fi
          fi

      - name: Wait for database readiness
        run: |
          echo "=== Waiting for PostgreSQL to be ready ==="
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U devpocket_test -d devpocket-fastify-api-test; then
              echo "PostgreSQL is ready!"
              break
            else
              echo "Attempt $i: PostgreSQL not ready, waiting 2 seconds..."
              sleep 2
            fi
          done
          
          # Final check
          if ! pg_isready -h localhost -p 5432 -U devpocket_test -d devpocket-fastify-api-test; then
            echo "PostgreSQL failed to become ready after 60 seconds"
            exit 1
          fi
          
      - name: Verify environment setup
        run: |
          echo "=== Environment Variables ==="
          echo "NODE_ENV: $NODE_ENV"
          echo "DATABASE_URL: postgresql://devpocket_test:devpocket_test@localhost:5432/devpocket-fastify-api-test?schema=public"
          echo "REDIS_URL: redis://localhost:6379/1"
          echo ""
          echo "=== Environment File Contents ==="
          cat .env.test
        env:
          NODE_ENV: test

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Test database connection
        run: |
          echo "=== Testing Database Connectivity ==="
          PGPASSWORD=devpocket_test psql -h localhost -p 5432 -U devpocket_test -d devpocket-fastify-api-test -c "SELECT version();" || {
            echo "Direct psql connection failed, trying to debug..."
            echo "Available databases:"
            PGPASSWORD=devpocket_test psql -h localhost -p 5432 -U devpocket_test -d postgres -c "\l" || echo "Could not list databases"
            exit 1
          }
          echo "Database connection successful!"

      - name: Wait for SSH server readiness
        if: vars.SSH_TEST_REAL_SERVER == 'true'
        run: |
          echo "=== Waiting for Docker SSH server to be ready ==="
          
          # Wait for container to be healthy
          echo "Checking container health status..."
          for i in {1..60}; do
            HEALTH_STATUS=$(docker inspect ssh-server --format='{{.State.Health.Status}}' 2>/dev/null || echo "unknown")
            if [[ "$HEALTH_STATUS" == "healthy" ]]; then
              echo "Container reports healthy status"
              break
            else
              echo "Attempt $i: Container health status: $HEALTH_STATUS, waiting 2 seconds..."
              sleep 2
            fi
          done
          
          # Wait for port to be available
          echo "Checking SSH port availability..."
          for i in {1..30}; do
            if nc -z localhost 2222; then
              echo "SSH server port is open"
              break
            else
              echo "Attempt $i: SSH port not ready, waiting 2 seconds..."
              sleep 2
            fi
          done
          
          # Final connectivity test with authentication bypass for initial test
          echo "Testing SSH connectivity..."
          sleep 5  # Additional time for SSH service to fully initialize
          if timeout 10 ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222 testuser@localhost echo "SSH ready" 2>/dev/null; then
            echo "SSH server is ready and accepting connections!"
          else
            echo "SSH connection test failed, checking container status..."
            echo "Container health: $(docker inspect ssh-server --format='{{.State.Health.Status}}' 2>/dev/null || echo 'unknown')"
            echo "Container logs (last 20 lines):"
            docker logs ssh-server --tail 20 2>/dev/null || echo "Could not retrieve logs"
            echo "Port check: $(nc -z localhost 2222 && echo 'Port open' || echo 'Port closed')"
            echo "Note: Container may still be usable for tests"
          fi

      - name: Run database migrations
        run: pnpm run db:push
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://devpocket_test:devpocket_test@localhost:5432/devpocket-fastify-api-test?schema=public

      - name: Lint code
        run: pnpm run lint

      - name: Type check
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://devpocket_test:devpocket_test@localhost:5432/devpocket-fastify-api-test?schema=public
          REDIS_URL: redis://localhost:6379/1

      # - name: Upload coverage reports
      #   uses: codecov/codecov-action@v3
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: ./coverage/coverage-final.json
      #     fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Create production artifact
        run: |
          tar -czf devpocket-api.tar.gz \
            dist/ \
            package.json \
            pnpm-lock.yaml \
            prisma/ \
            .env.example

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: devpocket-api-build
          path: devpocket-api.tar.gz
          retention-days: 30