version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: devpocket-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devpocket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpocket}
      POSTGRES_DB: ${POSTGRES_DB:-devpocket-fastify-api-dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devpocket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devpocket-network

  redis:
    image: redis:7-alpine
    container_name: devpocket-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devpocket-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: devpocket-app
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-devpocket}:${POSTGRES_PASSWORD:-devpocket}@postgres:5432/${POSTGRES_DB:-devpocket-fastify-api-dev}?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devpocket-network
    command: pnpm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  devpocket-network:
    driver: bridge