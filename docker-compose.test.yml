version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: devpocket-postgres-test
    environment:
      POSTGRES_USER: devpocket_test
      POSTGRES_PASSWORD: devpocket_test
      POSTGRES_DB: devpocket-fastify-api-test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devpocket_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devpocket-test-network

  redis-test:
    image: redis:7-alpine
    container_name: devpocket-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devpocket-test-network

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  devpocket-test-network:
    driver: bridge